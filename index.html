<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <script src="controle switch.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        //função automática que é executada uma unica vez depois que a página é totalmente carregada!
        (function(){
            document.addEventListener("DOMContentLoaded",function(){
                alert("Bem vindo ao progama de controle de gastos!");
            })
        })();
    </script>
    <main>
        <h1>Controle de Gastos</h1>
        <form>
            <fieldset>
                <legend>Controle de Gastos</legend>
                <input type="number" name="valor" id="valor" required placeholder="Digite o valor do gasto">
                <select name="categoria" id="categoria">
                    <option value="alimentacao">Alimentação</option>
                    <option value="transporte">Transporte</option>
                    <option value="lazer">Lazer</option>
                    <option value="outros">Outros</option>
                </select>
                <input onclick="adicionar(document.getElementById('categoria').value, Number(document.getElementById('valor').value))" type="button" value="Adicionar!">
            </fieldset>
            <fieldset>
                <legend>Relatório</legend>
                <input type="number" name="totalAlimentacao" id="totalAlimentacao" readonly>
                <input type="number" name="totalTransporte" id="totalTransporte" readonly>
                <input type="number" name="totalLazer" id="totalLazer" readonly>
                <input type="number" name="totalOutros" id="totalOutros" readonly>
                <input type="number" name="totalGeral" id="totalGeral" readonly>
            </fieldset>
        </form>
        
    </main>
</body>
</html>
