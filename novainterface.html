<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos Refatorado</title>
    <link rel="stylesheet" href="Estilos/tela.css" media="screen"> // media types
    <link rel="stylesheet" href="Estilos/telaRetrato" media="screen and (orientation: portrait)"> // media features ficam entre parenteses
    <link rel="stylesheet" href="Estilos/telaPaisagem" media="screen and (orientation: landscape)">
    <link rel="stylesheet" href="Estilos/impressora.css" media="print">
    <link rel="stylesheet" href="Estilos/geral" media="all"> //media types
</head>
<body>
    <h1>CONTROLE DE GASTOS REFATORADO</h1>
    <form id="formulario">
        <fieldset>
            <legend>Cadastro Despesa</legend>
            <input type="text" name="valor" id="valor" placeholder="Digite o Valor da Despesa" required>
            <input type="text" name="categoria" id="categoria" list="opcoes" required autocomplete="off">
            <datalist id="opcoes">
                <option value="alimentacao">Alimentacao</option>
            </datalist>
            <input type="submit" value="Cadastrar" id="btnCadastrar">
        </fieldset>

        <fieldset>
            <legend>Lista de Eventos</legend>
            <ul id="resultado">
                <li id="">Nome Categoria: R$ 10,00</li>
            </ul>
            
        </fieldset>

        <fieldset>
            <legend>Totalizador</legend>
            <ul id="subtotal"></ul>
            <input type="text" name="totalGeral" id="totalGeral" readonly placeholder="Total Geral: R$ 10,00">
        </fieldset>
    </form>
    <script type="module" src="JavaScript/Sistema.js"></script>
</body>
</html>
